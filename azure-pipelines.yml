trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run typecheck
    displayName: 'TypeScript type check'

  - script: npm run lint
    displayName: 'ESLint'

  - script: npm test
    displayName: 'Vitest'

  - script: npm run build
    displayName: 'Production build'
